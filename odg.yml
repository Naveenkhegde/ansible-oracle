---
- name: Set up Oracle Data Guard Standby Database
  hosts: oracle_db_servers
  become: yes
  vars:
    oracle_user: oracle
    primary_host: 192.168.130.151
    standby_host: 192.168.130.152
    oracle_home: /u01/app/oracle/product/19.0.0/db_1
    oracle_sid_primary: oradb
    oracle_sid_standby: oradb_s2
    rman_backup_dir: /media/sf_shared/oradb_backup
    standby_data_dir: /u01/app/oracle/oradata/ORADB
    standby_admin_dir: /u01/app/oracle/admin/oradb_s2
    archivelog_cleanup_script_dir: /home/oracle/scripts
    log_dir: /home/oracle/scripts/cleanarchive.log
    tns_admin_dir: "{{ oracle_home }}/network/admin"
    fra_dir: /u01/app/oracle/recovery_area
    tnsnames_entry: |
      ORADB_S2 =
        (DESCRIPTION =
          (ADDRESS = (PROTOCOL = TCP)(HOST = srv2.localdomain)(PORT = 1521))
          (CONNECT_DATA =
            (SERVER = DEDICATED)
            (SERVICE_NAME = oradb_s2.localdomain)
          ) (UR=A)
        )
    sqlnet_entry: "NAMES.DIRECTORY_PATH= (TNSNAMES, EZCONNECT)"



  tasks:


    - name: Step 1 - Enable archiving mode in primary database
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_primary }}
        $ORACLE_HOME/bin/sqlplus / as sysdba <<EOF
        ALTER SYSTEM SET LOG_ARCHIVE_DEST_1 = 'LOCATION=USE_DB_RECOVERY_FILE_DEST' scope=BOTH;
        SHUTDOWN IMMEDIATE;
        STARTUP MOUNT;
        ALTER DATABASE ARCHIVELOG;
        ALTER DATABASE OPEN;
        ALTER SYSTEM SWITCH LOGFILE;
        exit;
        EOF
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 2 - Enable forced logging
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_primary }}
        {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
        ALTER DATABASE FORCE LOGGING;
        exit;
        EOF
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 3 - Configure standby redo logs on primary
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_primary }}
        {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
        ALTER DATABASE ADD STANDBY LOGFILE THREAD 1 SIZE 200M;
        ALTER DATABASE ADD STANDBY LOGFILE THREAD 1 SIZE 200M;
        ALTER DATABASE ADD STANDBY LOGFILE THREAD 1 SIZE 200M;
        ALTER DATABASE ADD STANDBY LOGFILE THREAD 1 SIZE 200M;
        exit;
        EOF
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 4 - Set primary database initialization parameters for Data Guard
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_primary }}
        {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
        ALTER SYSTEM SET LOG_ARCHIVE_CONFIG='DG_CONFIG=(oradb,oradb_s2)' scope=BOTH;
        ALTER SYSTEM SET LOG_ARCHIVE_DEST_2='SERVICE=oradb_s2 ASYNC VALID_FOR=(ONLINE_LOGFILES,PRIMARY_ROLE) DB_UNIQUE_NAME=oradb_s2' scope=BOTH;
        ALTER SYSTEM SET ARCHIVE_LAG_TARGET=1800 scope=BOTH;
        ALTER SYSTEM SET FAL_SERVER='oradb_s2' scope=BOTH;
        ALTER SYSTEM SET STANDBY_FILE_MANAGEMENT='AUTO' scope=BOTH;
        exit;
        EOF
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 5 - Enable flashback database
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_primary }}
        {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
        ALTER SYSTEM SET DB_FLASHBACK_RETENTION_TARGET=2880 scope=BOTH;
        ALTER DATABASE FLASHBACK ON;
        exit;
        EOF
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 6 - Set CONTROL_FILE_RECORD_KEEP_TIME
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_primary }}
        {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
        ALTER SYSTEM SET CONTROL_FILE_RECORD_KEEP_TIME=30 SCOPE=BOTH;
        exit;
        EOF
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 7 - Verify password file exists on primary
      ansible.builtin.command:
        cmd: "ls -al {{ oracle_home }}/dbs/orapworadb"
      become_user: "{{ oracle_user }}"
      ignore_errors: yes
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 8 - Verify OMF is not configured
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_primary }}
        {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
        show parameter DB_CREATE_FILE_DEST
        exit;
        EOF
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 9 - Configure tnsnames.ora with standby entry
      ansible.builtin.lineinfile:
        path: "{{ tns_admin_dir }}/tnsnames.ora"
        line: "{{ tnsnames_entry }}"
        create: yes
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 29 - Verify or create sqlnet.ora (optional) on primary
      ansible.builtin.copy:
        content: "{{ sqlnet_entry }}"
        dest: "{{ tns_admin_dir }}/sqlnet.ora"
      become_user: "{{ oracle_user }}"
      ignore_errors: yes
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    # --- Steps for Standby Database Setup ---

    - name: Step 10 - Create FRA directory on standby
      ansible.builtin.file:
        path: "{{ fra_dir }}"
        state: directory
        owner: "{{ oracle_user }}"
        mode: '0755'
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"

    - name: Step 11 - Create init.ora file for standby
      ansible.builtin.shell: |
        echo 'DB_NAME=oradb' > {{ oracle_home }}/dbs/initoradb_s2.ora
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"



    - name: Step 12.1 - Fetch password file from primary host to control node
      ansible.builtin.fetch:
        src: /u01/app/oracle/product/19.0.0/db_1/dbs/orapworadb
        dest: /tmp/orapworadb
        flat: yes
      delegate_to: "{{ primary_host }}"
    - name: Step 12.1 - Copy password file from control node to standby host
      ansible.builtin.copy:
        src: /tmp/orapworadb
        dest: "{{ oracle_home }}/dbs/orapworadb_s2"
        owner: oracle
        group: oinstall
        mode: '0640'
      when: inventory_hostname == "standby_host"


    - name: Step 13.1 - Fetch tnsnames.ora file from primary host to control node
      ansible.builtin.fetch:
        src: "{{ tns_admin_dir }}/tnsnames.ora"
        dest: /tmp/tnsnames.ora
        flat: yes
      delegate_to: "{{ primary_host }}"
    - name: Step 13.2 - Copy tnsnames.ora file from control node to standby host
      ansible.builtin.copy:
        src: /tmp/tnsnames.ora
        dest: "{{ tns_admin_dir }}/tnsnames.ora"
        owner: oracle
        group: oinstall
        mode: '0640'
      when: inventory_hostname == "standby_host"

    - name: Step 14 - Verify or create sqlnet.ora (optional) on standby
      ansible.builtin.copy:
        content: "{{ sqlnet_entry }}"
        dest: "{{ tns_admin_dir }}/sqlnet.ora"
      become_user: "{{ oracle_user }}"
      ignore_errors: yes
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"

    - name: Step 15 - Configure listener.ora on standby
      ansible.builtin.copy:
        dest: "{{ tns_admin_dir }}/listener.ora"
        content: |
          LISTENER =
            (DESCRIPTION_LIST =
              (DESCRIPTION =
                (ADDRESS = (PROTOCOL = TCP)(HOST = srv2.localdomain)(PORT = 1521))
                (ADDRESS = (PROTOCOL = IPC)(KEY = EXTPROC1521))
              )
            )

          SID_LIST_LISTENER=
            (SID_LIST=
                  (SID_DESC=
                    (GLOBAL_DBNAME=oradb_s2.localdomain)
                    (SID_NAME=oradb_s2)
                    (ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1)
                  )
                )
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"

    - name: Step 16 - Restart listener on standby
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        lsnrctl stop
        lsnrctl start
        lsnrctl services
      become_user: "{{ oracle_user }}"
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"

    - name: Step 17 - Create backup directory on primary server
      ansible.builtin.file:
        path: "{{ rman_backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"

    - name: Step 37.2 - Take RMAN backup on primary
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID=oradb
        export TNS_ADMIN=/u01/app/oracle/product/19.0.0/db_1/network/admin
        rman target / <<EOF
        BACKUP FORMAT '/media/sf_shared/oradb_backup/ORADB%U.bck' DATABASE CURRENT CONTROLFILE FORMAT '/media/sf_shared/oradb_backup/ORADBCTL%U.bck' SPFILE FORMAT '/media/sf_shared/oradb_backup/ORADBSPFILE%U.bck' PLUS ARCHIVELOG FORMAT '/media/sf_shared/oradb_backup/ORADBARC%U.bck';
        exit;
        EOF
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"
      become_user: "{{ oracle_user }}"
      ignore_errors: yes

    - name: Step 18 - Create standby directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: oracle
        group: oinstall
        
      with_items:
        - "{{ standby_admin_dir }}"
        - "{{ standby_admin_dir }}/adump"
        - "{{ standby_admin_dir }}/cdump"
        - "{{ standby_data_dir }}"
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"

    
    - name: Step 19 - Start auxiliary instance on standby
      ansible.builtin.shell:
        cmd: |
          export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
          export PATH=$ORACLE_HOME/bin:$PATH
          export ORACLE_SID={{ oracle_sid_standby }}
          {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
          STARTUP NOMOUNT;
          exit;
          EOF
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"
      become_user: "{{ oracle_user }}"




    - name: Step 20 - Duplicate database to standby using RMAN
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_standby }}
        export TNS_ADMIN=/u01/app/oracle/product/19.0.0/db_1/network/admin
        rman AUXILIARY sys/oracle@oradb_s2 <<EOF
        run {
          DUPLICATE TARGET DATABASE FOR STANDBY DORECOVER NOFILENAMECHECK
          SPFILE
          SET DB_UNIQUE_NAME 'oradb_s2'
          SET LOG_ARCHIVE_DEST_2 'SERVICE=oradb ASYNC VALID_FOR=(ONLINE_LOGFILES,PRIMARY_ROLE) DB_UNIQUE_NAME=oradb'
          SET CONTROL_FILES '/u01/app/oracle/oradata/ORADB/control01.ctl'
          SET DB_RECOVERY_FILE_DEST '/u01/app/oracle/recovery_area'
          SET DB_RECOVERY_FILE_DEST_SIZE '42949672960'
          SET AUDIT_FILE_DEST '/u01/app/oracle/admin/oradb_s2/adump'
          SET FAL_SERVER 'oradb'
          BACKUP LOCATION '/media/sf_shared/oradb_backup/';
        }
        exit;
        EOF
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"
      become_user: "{{ oracle_user }}"
      ignore_errors: yes

    - name: Step 21 - Mount the standby database and verify role
      ansible.builtin.shell:
        cmd: |
          export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
          export PATH=$ORACLE_HOME/bin:$PATH
          export ORACLE_SID={{ oracle_sid_standby }}
          {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
          STARTUP FORCE MOUNT;
          SELECT DATABASE_ROLE FROM V$DATABASE;
          exit;
          EOF
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"
      become_user: "{{ oracle_user }}"

    - name: Step 22 - Start redo apply on standby
      ansible.builtin.shell:
        cmd: |
          export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
          export PATH=$ORACLE_HOME/bin:$PATH
          export ORACLE_SID={{ oracle_sid_standby }}
          {{ oracle_home }}/bin/sqlplus / as sysdba <<EOF
          ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION;
          exit;
          EOF
      delegate_to: "{{ standby_host }}"
      when: inventory_hostname == "standby_host"
      become_user: "{{ oracle_user }}"

    - name: Step 23 - Configure archivelog deletion policy
      ansible.builtin.shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/db_1
        export PATH=$ORACLE_HOME/bin:$PATH
        export ORACLE_SID={{ oracle_sid_primary }}
        export TNS_ADMIN=/u01/app/oracle/product/19.0.0/db_1/network/admin
        rman target / <<EOF
        CONFIGURE ARCHIVELOG DELETION POLICY TO APPLIED ON ALL STANDBY;
        exit;
        EOF
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"
      become_user: "{{ oracle_user }}"

    - name: Step 24 - Create script directory for archivelog cleanup
      ansible.builtin.file:
        path: "{{ archivelog_cleanup_script_dir }}"
        state: directory
        mode: '0755'
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"
      become_user: "{{ oracle_user }}"

    - name: Step 25 - Create RMAN script for archivelog deletion
      ansible.builtin.copy:
        content: |
          RUN {
            DELETE NOPROMPT ARCHIVELOG ALL COMPLETED BEFORE 'SYSDATE-1';
          }
        dest: "{{ archivelog_cleanup_script_dir }}/deletearc.ora"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"
      become_user: "{{ oracle_user }}"

    - name: Step 26 - Create shell script for cron job
      ansible.builtin.copy:
        content: |
          $ORACLE_HOME/bin/rman target / cmdfile {{ archivelog_cleanup_script_dir }}/deletearc.ora log {{ log_dir }} append
        dest: "{{ archivelog_cleanup_script_dir }}/cleanarchive.sh"
        mode: '0755'
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"
      become_user: "{{ oracle_user }}"

    - name: Step 27 - Add cron job for archivelog cleanup
      ansible.builtin.cron:
        name: "Archive log cleanup"
        minute: "00"
        hour: "23"
        user: "{{ oracle_user }}"
        job: "/bin/sh {{ archivelog_cleanup_script_dir }}/cleanarchive.sh >> {{ log_dir }} 2>&1"
      delegate_to: "{{ primary_host }}"
      when: inventory_hostname == "primary_host"
      become_user: "{{ oracle_user }}"


